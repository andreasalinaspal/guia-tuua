<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guía de campo · TUUA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000091">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guía TUUA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

  :root{
    --navy:#000091;
    --blue:#2170A8;
    --ink:#14203a;
    --paper:#EFF1F6;
    --soft:#F5F6FA;
    --card:#ffffff;
    --green:#2E7D46; --green-bg:#E7F3EB; --green-br:#BEE0C8;
    --red:#B23A48;   --red-bg:#FBE9EC;   --red-br:#F0C3CB;
    --amber:#B07A10; --amber-bg:#FBF2DC; --amber-br:#EAD79E;
    --purp:#5B4B8A;  --purp-bg:#EEE9F6;  --purp-br:#D3C7EA;
    --grey:#5c6472;
    --line:#E6E8EF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }

  /* Header */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--navy);
    color:#fff;
    padding:14px 18px 12px;
    box-shadow:0 2px 12px rgba(0,20,60,.18);
  }
  .h-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .h-title{font-family:'Poppins',sans-serif;font-weight:600;font-size:17px;letter-spacing:.2px;}
  .h-title span{opacity:.6;font-weight:500;}
  .h-crumb{
    margin-top:8px;font-size:12px;color:#aebfe0;
    min-height:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  }
  .h-crumb b{color:#fff;font-weight:600;}
  .chip{
    display:inline-block;padding:2px 9px;border-radius:999px;white-space:nowrap;
    font-size:11px;font-weight:600;letter-spacing:.3px;
    background:rgba(255,255,255,.14);color:#fff;
  }
  .h-title{white-space:nowrap;}

  /* Progress dots per path */
  main{max-width:560px;margin:0 auto;padding:20px 16px 0;}

  .step{animation:rise .28s cubic-bezier(.2,.7,.3,1);}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .eyebrow{
    font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--blue);margin-bottom:10px;
  }
  .q{
    font-family:'Poppins',sans-serif;
    font-size:25px;line-height:1.22;font-weight:600;color:var(--ink);
    margin:0 0 6px;letter-spacing:-.2px;
  }
  .q-sub{font-size:14.5px;color:var(--grey);margin:0 0 20px;}

  /* Answer buttons */
  .opts{display:flex;flex-direction:column;gap:11px;margin-top:6px;}
  button.opt{
    font-family:inherit;font-size:16.5px;font-weight:600;text-align:left;
    background:var(--soft);color:var(--ink);
    border:1.5px solid transparent;
    border-radius:18px;padding:17px 18px;
    cursor:pointer;transition:transform .08s, border-color .15s, box-shadow .15s, background .15s;
    display:flex;align-items:center;gap:13px;
  }
  button.opt:active{transform:scale(.985);background:#eef0f4;}
  button.opt .arw{margin-left:auto;color:var(--grey);font-size:20px;opacity:.5;flex-shrink:0;}
  button.opt .ic{
    width:38px;height:38px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
    background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(16,24,40,.06);
  }
  button.opt.green{border-color:var(--green-br);background:var(--green-bg);}
  button.opt.green .ic{background:var(--green);color:#fff;}
  button.opt.red{border-color:var(--red-br);background:var(--red-bg);}
  button.opt.red .ic{background:var(--red);color:#fff;}
  button.opt.amber{border-color:var(--amber-br);background:var(--amber-bg);}
  button.opt.amber .ic{background:var(--amber);color:#fff;}
  button.opt.purp{border-color:var(--purp-br);background:var(--purp-bg);}
  button.opt.purp .ic{background:var(--purp);color:#fff;}

  /* Ask list (questions to read) */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:6px 4px;margin-top:4px;overflow:hidden;
  }
  .ask{
    display:flex;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line);
    align-items:flex-start;
  }
  .ask:last-child{border-bottom:none;}
  .ask .n{
    flex-shrink:0;width:23px;height:23px;border-radius:7px;margin-top:1px;
    background:var(--paper);color:var(--navy);
    font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .ask .txt{font-size:15.5px;color:var(--ink);font-weight:500;}
  .ask .txt em{display:block;color:var(--grey);font-size:13px;font-style:normal;margin-top:3px;font-weight:400;}

  .note{
    display:flex;gap:9px;align-items:flex-start;
    background:var(--amber-bg);border:1px solid var(--amber-br);
    border-radius:13px;padding:12px 13px;margin-top:14px;
    font-size:13.5px;color:#6b5313;
  }
  .note b{color:var(--amber);}
  .note.tip{background:#EAF1FB;border-color:#C6D8F2;color:#264a80;}
  .note.tip b{color:var(--blue);}

  .path-banner{
    display:flex;align-items:center;gap:10px;
    border-radius:14px;padding:13px 15px;margin-bottom:18px;
    font-weight:600;font-size:15px;
  }
  .path-banner .tag{font-size:12px;font-weight:700;letter-spacing:.5px;padding:3px 10px;border-radius:999px;color:#fff;}
  .path-banner.green{background:var(--green-bg);border:1px solid var(--green-br);color:#1f5a32;}
  .path-banner.green .tag{background:var(--green);}
  .path-banner.red{background:var(--red-bg);border:1px solid var(--red-br);color:#7d2733;}
  .path-banner.red .tag{background:var(--red);}
  .path-banner.amber{background:var(--amber-bg);border:1px solid var(--amber-br);color:#6b5313;}
  .path-banner.amber .tag{background:var(--amber);}
  .path-banner.purp{background:var(--purp-bg);border:1px solid var(--purp-br);color:#463a6b;}
  .path-banner.purp .tag{background:var(--purp);}

  .section-label{
    font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    color:var(--grey);margin:22px 2px 9px;
  }

  .divider{height:1px;background:var(--line);margin:20px 0;}

  /* Next / continue button */
  .next{
    font-family:inherit;font-size:16px;font-weight:700;
    width:100%;background:var(--navy);color:#fff;border:none;
    border-radius:14px;padding:16px;margin-top:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .08s;
  }
  .next:active{transform:scale(.99);}
  .next.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--line);}

  /* Bottom bar */
  .botbar{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:rgba(239,241,246,.92);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px;max-width:560px;margin:0 auto;
  }
  .botbar button{
    font-family:inherit;font-size:14.5px;font-weight:600;
    border-radius:12px;padding:12px;cursor:pointer;flex:1;
    display:flex;align-items:center;justify-content:center;gap:7px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);
  }
  .botbar button:active{transform:scale(.98);}
  .botbar button.home{color:var(--red);border-color:var(--red-br);background:var(--red-bg);}
  .botbar button:disabled{opacity:.4;}

  .kicker{font-size:13px;color:var(--grey);margin-bottom:2px;}

  .pill-row{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 2px;}
  
  .shot{margin:2px 0 6px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;}
  .shot img{display:block;width:100%;height:auto;}
  .shot-cap{font-size:12.5px;color:var(--grey);padding:9px 13px;border-top:1px solid var(--line);background:var(--paper);}

  .pill{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--grey);}

  /* ---- Captura de respuestas ---- */
  .ask .cap{margin-top:9px;}
  .ask textarea{
    width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);
    border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;
    background:var(--paper);resize:vertical;min-height:40px;line-height:1.4;
  }
  .ask textarea:focus{outline:none;border-color:var(--blue);background:#fff;}
  .scale{display:flex;gap:7px;margin-top:9px;}
  .scale button{
    flex:1;font-family:inherit;font-size:15px;font-weight:700;
    border:1.5px solid var(--line);background:#fff;color:var(--grey);
    border-radius:10px;padding:9px 0;cursor:pointer;transition:transform .07s;
  }
  .scale button:active{transform:scale(.94);}
  .scale button.sel{background:var(--navy);color:#fff;border-color:var(--navy);}

  /* Campos de contexto en el inicio (país / conexión) */
  .meta-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin:4px 0 16px;}
  .meta-card label{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--grey);margin:0 0 5px;}
  .meta-card input{width:100%;font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--paper);color:var(--ink);}
  .meta-card input:focus{outline:none;border-color:var(--blue);background:#fff;}
  .meta-card .row2{display:flex;gap:10px;margin-top:11px;}
  .meta-card .row2>div{flex:1;}

  /* Botón menú en header */
  .h-menu{
    background:rgba(255,255,255,.14);border:none;color:#fff;
    width:31px;height:31px;border-radius:9px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .h-menu:active{transform:scale(.94);}
  .h-count{font-size:11px;font-weight:700;background:var(--green);color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;}

  /* Sheet / panel inferior */
  .backdrop{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;}
  .backdrop.on{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:90;
    background:var(--paper);border-radius:20px 20px 0 0;
    max-width:560px;margin:0 auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.7,.3,1);
    box-shadow:0 -8px 30px rgba(0,20,60,.25);
  }
  .sheet.on{transform:none;}
  .sheet h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:20px;margin:0 0 4px;color:var(--ink);}
  .sheet p.sub{font-size:13.5px;color:var(--grey);margin:0 0 16px;}
  .sheet .act{
    width:100%;font-family:inherit;font-size:15.5px;font-weight:600;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);
    border-radius:13px;padding:14px;margin-top:10px;cursor:pointer;
    display:flex;align-items:center;gap:11px;text-align:left;
  }
  .sheet .act:active{transform:scale(.99);}
  .sheet .act .ic{width:30px;height:30px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .sheet .act.danger{color:var(--red);border-color:var(--red-br);background:var(--red-bg);}
  .sheet .act.danger .ic{background:var(--red);}
  .sheet .act small{display:block;font-weight:400;font-size:12.5px;color:var(--grey);margin-top:1px;}
  .sheet .close{width:100%;background:transparent;border:none;color:var(--grey);font-family:inherit;font-size:14.5px;padding:14px 0 2px;cursor:pointer;}

  /* ---- Pantalla de bienvenida ---- */
  .welcome{padding-top:18px;}
  .hero-badge{
    width:58px;height:58px;border-radius:18px;
    background:var(--navy);color:#fff;font-size:26px;
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;
    box-shadow:0 8px 22px rgba(11,18,32,.22);
  }
  .hero-badge.ok{background:var(--green);box-shadow:0 8px 22px rgba(46,125,70,.28);font-size:30px;}
  .hero-title{font-family:'Poppins',sans-serif;font-size:28px;line-height:1.15;font-weight:600;color:var(--ink);margin:0 0 8px;letter-spacing:-.3px;}
  .hero-sub{font-size:15px;color:var(--grey);margin:0 0 24px;line-height:1.55;}
  .big-action{
    width:100%;font-family:inherit;text-align:left;cursor:pointer;
    background:var(--soft);border:1.5px solid transparent;border-radius:20px;
    padding:18px;margin-bottom:13px;display:flex;align-items:center;gap:14px;
    transition:transform .08s, background .15s;
  }
  .big-action:active{transform:scale(.99);}
  .big-action .ic{
    width:44px;height:44px;border-radius:14px;flex-shrink:0;font-size:20px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.06);
  }
  .big-action .tx{font-size:17px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;}
  .big-action .tx small{font-weight:400;font-size:13px;color:var(--grey);margin-top:2px;}
  .big-action .arw{margin-left:auto;font-size:20px;color:var(--grey);opacity:.55;flex-shrink:0;}
  .big-action.primary{background:var(--navy);}
  .big-action.primary .tx,.big-action.primary .tx small{color:#fff;}
  .big-action.primary .tx small{opacity:.7;}
  .big-action.primary .arw{color:#fff;opacity:.8;}
  .big-action.primary .ic{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;}
  .hero-foot{font-size:12.5px;color:var(--grey);text-align:center;margin-top:20px;opacity:.85;}
  .big-action.link, a.act{text-decoration:none;}
  .uat-link{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;font-family:inherit;font-size:16px;font-weight:700;text-decoration:none;
    background:var(--blue);color:#fff;border-radius:14px;padding:15px;margin:2px 0 16px;
  }
  .uat-link:active{transform:scale(.99);}
  .big-action.link .arw{font-size:17px;}

  /* ---- Campos apilados (contexto y formularios) ---- */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:0 0 7px;}
  .field input{
    width:100%;font-family:inherit;font-size:16px;color:var(--ink);
    border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;
    background:var(--soft);transition:border-color .15s, background .15s;
  }
  .field input:focus{outline:none;border-color:var(--navy);background:#fff;}
  .field input::placeholder{color:#9aa1ad;}

  /* ---- Estado de sincronización ---- */
  .sync-status{font-size:13px;font-weight:600;margin:-6px 0 14px;padding:9px 12px;border-radius:11px;}
  .sync-status.ok{background:var(--green-bg);color:#1f5a32;border:1px solid var(--green-br);}
  .sync-status.warn{background:var(--amber-bg);color:#6b5313;border:1px solid var(--amber-br);}
  .sync-status.off{background:var(--soft);color:var(--grey);border:1px solid var(--line);}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div class="h-title">Guía de campo <span>· TUUA</span></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="pathChip"></div>
      <button class="h-menu" onclick="goTo('welcome')" aria-label="Inicio">🏠</button>
      <button class="h-menu" id="menuBtn" onclick="openSheet()" aria-label="Datos y exportar">⋯</button>
    </div>
  </div>
  <div class="h-crumb" id="crumb">Toca la respuesta del pasajero para avanzar</div>
</header>

<main id="app"></main>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <h2>Entrevistas de la jornada</h2>
  <p class="sub" id="sheetSub">Sin entrevistas guardadas todavía.</p>
  <p class="sync-status off" id="syncStatus"></p>
  <button class="act" onclick="syncAll()"><span class="ic">☁</span><span>Sincronizar ahora<small>Sube las entrevistas pendientes a la nube</small></span></button>
  <button class="act" onclick="exportData('csv')"><span class="ic">⬇</span><span>Exportar CSV<small>Una fila por entrevista, para Excel/Sheets</small></span></button>
  <button class="act" onclick="exportData('json')"><span class="ic">{ }</span><span>Exportar JSON<small>Datos completos para análisis</small></span></button>
  <button class="act danger" onclick="clearData()"><span class="ic">🗑</span><span>Borrar todo<small>Elimina las entrevistas guardadas en este equipo</small></span></button>
  <div class="section-label" style="margin:16px 2px 8px">Accesos rápidos</div>
  <div id="sheetAccesos"></div>
  <button class="close" onclick="closeSheet()">Cerrar</button>
</div>

<div class="botbar">
  <button id="backBtn" onclick="goBack()">← Atrás</button>
  <button class="home" onclick="reset()">↺ Nuevo pasajero</button>
</div>

const STORE = 'tuua_interviews';
const FRICTION_LABEL = {
  B_s1:'Primera impresión', B_s2:'Aviso inicial', B_s3:'Datos personales y vuelo',
  B_s4:'Datos / correo', B_s5:'Pago con tarjeta'

/* ================== SINCRONIZACIÓN CON GOOGLE SHEETS ==================
   Pega aquí la URL del Web App de Google Apps Script (termina en /exec).
   Mientras no la pegues, la app funciona 100% local (offline).
   Ver SETUP-SHEETS.md para crear la hoja y el script.                  */
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwWPjYn10pDjFz5MMAdxZxemha0AseV_xrdnEryiUY3RP68_8-tTTdWdzp7y81ccFWJJg/exec';

function sheetsReady(){
  return typeof SHEETS_URL==='string' && /^https:\/\/script\.google\.com\//.test(SHEETS_URL) && !SHEETS_URL.includes('PEGA');
}
// Código corto y único por pregunta, para el encabezado de columna.
function qCode(node,i){
  const m = node.match(/^B_s(\d)$/);
  if(m) return 'Bs'+m[1]+'.'+(i+1);
  if(node==='cierre') return 'Cierre.'+(i+1);
  return node.toUpperCase()+'.'+(i+1);   // A.1, B.2, D.1, E.3, DIGITAL.1, OTRO.1...
}
// Registro "ancho": meta + una clave por cada pregunta respondida (encabezado = código · texto).
function flatRecord(s){
  const rec = {
    id: s.id,
    inicio: new Date(s.start).toLocaleString('es-PE'),
    fin: s.updated ? new Date(s.updated).toLocaleString('es-PE') : '',
    pais_origen: s.meta.origen||'',
    pais_destino: s.meta.destino||'',
    conexion: s.meta.conexion||'',
    camino: caminoLetters(s)||'',
    friccion: s.friction ? (FRICTION_LABEL[s.friction]||s.friction) : '',
    respuestas: fmtAnswers(s)
  };
  for(const node in s.answers){
    const asks = (NODES[node] && NODES[node].ask) || [];
    (s.answers[node]||[]).forEach((a,i)=>{
      if(!a) return;
      const qt = asks[i] ? asks[i].t : '';
      const header = qCode(node,i) + (qt ? ' · ' + qt : '');
      let val = '';
      if(a.scale) val = '['+a.scale+'/5]';
      if(a.t && a.t.trim()) val += (val?' ':'') + a.t.trim();
      if(val) rec[header] = val;
    });
  }
  return rec;
}
async function syncOne(s){
  if(!sheetsReady()) return false;
  try{
    // no-cors: el POST llega a Apps Script; la respuesta es opaca (no se puede leer).
    await fetch(SHEETS_URL, {
      method:'POST', mode:'no-cors',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(flatRecord(s))
    });
    return true;
  }catch(e){ return false; }
}
async function syncAll(){
  if(!sheetsReady() || !navigator.onLine){ updateSync(); return; }
  const all = loadAll(); let changed=false;
  for(const s of all){
    if(s._synced) continue;
    if(await syncOne(s)){ s._synced = true; changed = true; }
  }
  if(changed) saveAll(all);
  updateSync();
}
let syncTimer = null;
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncAll, 1500); }
function updateSync(){
  const el = document.getElementById('syncStatus'); if(!el) return;
  if(!sheetsReady()){ el.textContent = 'Solo en este equipo (Google Sheets no configurado).'; el.className='sync-status off'; return; }
  const pending = loadAll().filter(s=>!s._synced).length;
  if(!navigator.onLine){ el.textContent = 'Sin conexión — '+pending+' por subir cuando vuelva la señal.'; el.className='sync-status warn'; return; }
  el.textContent = pending>0 ? ('Subiendo a Google Sheets… '+pending+' pendiente'+(pending>1?'s':'')+'.') : 'Todo enviado a Google Sheets ✓';
  el.className = pending>0 ? 'sync-status warn' : 'sync-status ok';
}

function newSession(){
  session = { id:Date.now(), start:new Date().toISOString(), updated:null,
              meta:{origen:'', destino:'', conexion:''}, trail:['context'], friction:null, answers:{} };
}
function loadAll(){ try{ return JSON.parse(localStorage.getItem(STORE)) || []; }catch(e){ return []; } }
function saveAll(a){ try{ localStorage.setItem(STORE, JSON.stringify(a)); }catch(e){} }
function hasContent(s){
  return s.trail.length>1 || s.friction || s.meta.origen || s.meta.destino || s.meta.conexion || Object.keys(s.answers).length>0;
}
function persist(){
  if(!session || !hasContent(session)) return;
  const all = loadAll();
  session.updated = new Date().toISOString();
  session._synced = false;
  const i = all.findIndex(x=>x.id===session.id);
  if(i>=0) all[i]=session; else all.push(session);
  saveAll(all);
  updateCount();
  scheduleSync();
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

function saveText(node,i,el){
  const a = session.answers[node] || (session.answers[node]=[]);
  a[i] = Object.assign(a[i]||{}, {t: el.value});
  persist();
}
function saveScale(node,i,val,btn){
  const a = session.answers[node] || (session.answers[node]=[]);
  a[i] = Object.assign(a[i]||{}, {scale: val});
  [...btn.parentElement.children].forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  persist();
}

function caminoLetters(s){
  const seen=[]; s.trail.forEach(id=>{
    const l = id.startsWith('A')?'A':id.startsWith('B')?'B':id==='C'?'C':id==='D'?'D':id==='E'?'E':'';
    if(l && !seen.includes(l)) seen.push(l);
  }); return seen.join('+');
}
function fmtAnswers(s){
  const parts=[];
  for(const node in s.answers){
    (s.answers[node]||[]).forEach((a,i)=>{
      if(!a) return; const bits=[];
      if(a.scale) bits.push('['+a.scale+'/5]');
      if(a.t && a.t.trim()) bits.push(a.t.trim());
      if(bits.length) parts.push(node+'#'+(i+1)+': '+bits.join(' '));
    });
  }
  return parts.join(' | ');
}

  document.getElementById('sheet').classList.add('on');

function closeSheet(){ document.getElementById('backdrop').classList.remove('on'); document.getElementById('sheet').classList.remove('on'); }

function download(name, text, mime){
  const blob = new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function stamp(){
  const d=new Date(), p=x=>String(x).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());
}
function exportData(kind){
  const all = loadAll();
  if(!all.length){ alert('No hay entrevistas para exportar todavía.'); return; }
  if(kind==='json'){
    download('tuua_entrevistas_'+stamp()+'.json', JSON.stringify(all,null,2), 'application/json');
    return;
  }
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows = [['id','inicio','fin','pais_origen','pais_destino','conexion','camino','pantalla_friccion','respuestas'].map(q).join(',')];
  all.forEach(s=>{
    rows.push([
      s.id,
      new Date(s.start).toLocaleString('es-PE'),
      s.updated? new Date(s.updated).toLocaleString('es-PE'):'',
      s.meta&&s.meta.origen, s.meta&&s.meta.destino, s.meta&&s.meta.conexion,
      caminoLetters(s),
      s.friction? (FRICTION_LABEL[s.friction]||s.friction):'',
      fmtAnswers(s)
    ].map(q).join(','));
  });
  download('tuua_entrevistas_'+stamp()+'.csv', '﻿'+rows.join('\r\n'), 'text/csv;charset=utf-8');
}
function clearData(){
  if(!confirm('¿Borrar TODAS las entrevistas guardadas en este equipo? Esta acción no se puede deshacer.')) return;
  saveAll([]); updateCount(); closeSheet();
}

      <div class="hero-badge">✈️</div>
      <h1 class="hero-title">Guía de campo TUUA</h1>
      <p class="hero-sub">Entrevistas de intercept a pasajeros sobre el pago de la TUUA de Transferencia. Toca la respuesta del pasajero y la guía te dice qué preguntar.</p>

      <button class="big-action primary" onclick="startInterview()">
        <span class="ic">＋</span>
        <span class="tx">Nueva entrevista<small>Empieza a registrar un nuevo pasajero</small></span>
        <span class="arw">→</span>
      </button>

      <button class="big-action" onclick="openSheet()">
        <span class="ic">📋</span>
        <span class="tx">Ver respuestas<small>${n>0 ? (n+' entrevista'+(n>1?'s':'')+' guardada'+(n>1?'s':'')) : 'Aún no hay entrevistas guardadas'}</small></span>
        <span class="arw">→</span>
      </button>

      <div class="section-label">Accesos rápidos</div>
      ${accesosBig()}

      <p class="hero-foot">Los datos se guardan en este equipo y funcionan sin conexión.</p>
    </div>`;
  updateChrome();
}

/* ---------- Pantalla de contexto (país origen/destino, conexión) ---------- */
function renderContext(){
  const m = session.meta;
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="step">
      <div class="eyebrow">Antes de empezar</div>
      <h1 class="q">Contexto del pasajero</h1>
      <p class="q-sub">Datos opcionales, sin identificar a la persona.</p>

      <div class="field">
        <label>País de origen</label>
        <input value="${escapeAttr(m.origen)}" placeholder="¿De dónde viene?"
               oninput="session.meta.origen=this.value;persist()">
      </div>

      <div class="field">
        <label>País de destino</label>
        <input value="${escapeAttr(m.destino)}" placeholder="¿A dónde va?"
               oninput="session.meta.destino=this.value;persist()">
      </div>

      <div class="field">
        <label>Tiempo de conexión</label>
        <input value="${escapeAttr(m.conexion)}" placeholder="Ej. escala de 2 h"
               oninput="session.meta.conexion=this.value;persist()">
      </div>

      <button class="next" onclick="goTo('tamizaje')">Continuar <span>→</span></button>
    </div>`;
  updateChrome();
}

/* ---------- Pantalla de éxito (entrevista finalizada) ---------- */
function renderDone(){
  const app = document.getElementById("app");
  let msg;
  if(!sheetsReady()) msg = "Se guardó en este equipo. Recuerda exportar al final de la jornada.";
  else if(navigator.onLine) msg = "Se guardó y se envió a Google Sheets.";
  else msg = "Se guardó en este equipo. Se enviará a la nube cuando vuelva la conexión.";
  app.innerHTML = `
    <div class="step welcome done">
      <div class="hero-badge ok">✓</div>
      <h1 class="hero-title">Respuesta guardada exitosamente</h1>
      <p class="hero-sub">${msg}</p>

      <button class="big-action primary" onclick="startInterview()">
        <span class="ic">＋</span>
        <span class="tx">Nuevo pasajero<small>Registrar otra entrevista</small></span>
        <span class="arw">→</span>
      </button>

      <button class="big-action" onclick="goHome()">
        <span class="ic">⌂</span>
        <span class="tx">Ir al inicio<small>Ver respuestas o salir</small></span>
        <span class="arw">→</span>
      </button>
    </div>`;
  syncAll();          // empuja la entrevista finalizada a la nube
  updateChrome();
}

function render(){
  const id = history[history.length-1];
  if(id==="welcome"){ renderWelcome(); return; }
  if(id==="context"){ renderContext(); return; }
  if(id==="done"){ renderDone(); return; }
  const n = NODES[id];
  const app = document.getElementById("app");
  let html = `<div class="step">`;

  // banner de camino
  if(n.banner){
    html += `<div class="path-banner ${n.banner.cls}"><span class="tag">${n.banner.tag}</span>${n.banner.txt}</div>`;
  }
  if(n.eyebrow) html += `<div class="eyebrow">${n.eyebrow}</div>`;
  if(n.kicker) html += `<div class="kicker">${n.kicker}</div>`;
  if(n.q) html += `<h1 class="q">${n.q}</h1>`;
  if(n.sub) html += `<p class="q-sub">${n.sub}</p>`;
  if(n.section) html += `<div class="section-label">${n.section}</div>`;

  // captura de la pantalla (sondas del camino B)
  if(n.img && SHOTS[n.img]){
    html += `<div class="shot"><img src="${SHOTS[n.img]}" alt="Pantalla" loading="lazy"><div class="shot-cap">Muéstrale esta pantalla para ubicar dónde se trabó</div></div>`;
  }

  // botón de enlace externo (ej. abrir plataforma UAT en otra pestaña)
  if(n.link){
    html += `<a class="uat-link" href="${n.link.url}" target="_blank" rel="noopener">${n.link.label} <span>↗</span></a>`;
  }

  // lista de preguntas a leer
  if(n.ask){
    html += `<div class="card">`;
    n.ask.forEach((a,i)=>{
      const stored = (session.answers[id] && session.answers[id][i]) || {};
      const isScale = a.scale===true || /1\s*al\s*5/i.test(a.t);
      let cap = '';
      if(isScale){
        cap += `<div class="scale">`;
        for(let v=1; v<=5; v++){
          cap += `<button class="${stored.scale===v?'sel':''}" onclick="saveScale('${id}',${i},${v},this)">${v}</button>`;
        }
        cap += `</div>`;
      }
      cap += `<textarea placeholder="Nota rápida…" oninput="saveText('${id}',${i},this)">${stored.t?escapeHtml(stored.t):''}</textarea>`;
      html += `<div class="ask"><div class="n">${i+1}</div><div class="txt">${a.t}${a.s?`<em>${a.s}</em>`:''}<div class="cap">${cap}</div></div></div>`;
    });
    html += `</div>`;
  }

  // opciones (botones que ramifican)
  if(n.opts){
    html += `<div class="opts">`;
    n.opts.forEach(o=>{
      html += `<button class="opt ${o.cls||''}" onclick="goTo('${o.go}')">
        <span class="ic">${o.ic||'›'}</span><span>${o.label}</span><span class="arw">›</span></button>`;
    });
    html += `</div>`;
  }

  // nota / tip
  if(n.tip){
    html += `<div class="note tip">💡<div><b>Tip.</b> ${n.tip}</div></div>`;
  }

  // botones de avance
  if(n.jump){
    html += `<button class="next ghost" onclick="goTo('${n.jump.go}')">${n.jump.label}</button>`;
  }
  if(n.next){
    html += `<button class="next" onclick="goTo('${n.next.go}')">${n.next.label}</button>`;
  }
  if(n.back){
    html += `<button class="next ghost" onclick="goTo('${n.back.go}')">${n.back.label}</button>`;
  }

  html += `</div>`;
  app.innerHTML = html;
  window.scrollTo({top:0,behavior:'smooth'});
  updateChrome();
}

function updateChrome(){
  const id = history[history.length-1];
  const n = NODES[id];
  const chip = document.getElementById("pathChip");
  const crumb = document.getElementById("crumb");
  const botbar = document.querySelector(".botbar");

  // La barra inferior se oculta en bienvenida y en la pantalla de éxito
  botbar.style.display = (id==="welcome" || id==="done") ? "none" : "flex";

  // Pantallas especiales (sin nodo)
  if(!n){
    chip.innerHTML = "";
    if(id==="welcome"){ crumb.textContent = "Toca una opción para empezar"; }
    else if(id==="context"){ crumb.innerHTML = `Paso previo · <b>Contexto</b>`; }
    else if(id==="done"){ crumb.innerHTML = `<b>Entrevista finalizada</b>`; }
    document.getElementById("backBtn").disabled = history.length<=1;
    return;
  }

  const letter = id.startsWith("A")?"A":id.startsWith("B")?"B":id==="C"?"C":id==="D"?"D":id==="E"?"E":"";
  chip.innerHTML = letter ? `<span class="chip">Camino ${letter}</span>` : "";
  if(n.banner){ crumb.innerHTML = `<b>${n.banner.txt}</b>`; }
  else if(n.q){ crumb.innerHTML = `Paso actual · <b>${n.eyebrow||'Tamizaje'}</b>`; }
  else { crumb.textContent = "Toca la respuesta del pasajero para avanzar"; }
  document.getElementById("backBtn").disabled = history.length<=1;
}

const VIRTUAL = ["welcome","context","done"];
function goTo(id){
  if(!NODES[id] && !VIRTUAL.includes(id)) return;
  history.push(id);
  if(session) session.trail.push(id);
  if(/^B_s[1-5]$/.test(id)) session.friction = id;
  persist();
  render();
}
function goBack(){
  if(history.length>1){ history.pop(); render(); }
}
function reset(){
  newSession();
  history = ["context"];
  render();
}

/* ---------- Arranque ---------- */
newSession();
history = ["welcome"];
updateCount();
render();

/* Sincronización: al cargar y cada vez que vuelve la conexión */
syncAll();
window.addEventListener('online', syncAll);

/* Registro del service worker (PWA offline) */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
